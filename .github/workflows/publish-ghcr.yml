name: Publish GHCR Images

on:
  workflow_dispatch:
    inputs:
      control_plane_tag:
        description: Control Plane image tag
        required: true
        default: 0.1.0-rc.1-admin.1
        type: string
      worker_tag:
        description: Worker image tag
        required: true
        default: 0.1.0-rc.1
        type: string
      target_apps_tag:
        description: Target Apps image tag
        required: true
        default: 0.1.0-rc.1
        type: string
      publish_latest:
        description: Also publish latest tags for all three images
        required: true
        default: false
        type: boolean

jobs:
  publish:
    name: Publish ${{ matrix.image_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: control-plane
            image_name: ploadtesting-control-plane
            context: ./control-plane
            dockerfile: ./control-plane/Dockerfile
          - id: worker
            image_name: ploadtesting-worker
            context: ./workers
            dockerfile: ./workers/Dockerfile
          - id: target-apps
            image_name: ploadtesting-target-apps
            context: ./target-apps
            dockerfile: ./target-apps/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute lowercase image namespace
        id: owner
        shell: bash
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Select image tag
        id: image_tag
        shell: bash
        run: |
          case "${{ matrix.id }}" in
            control-plane)
              tag='${{ inputs.control_plane_tag }}'
              ;;
            worker)
              tag='${{ inputs.worker_tag }}'
              ;;
            target-apps)
              tag='${{ inputs.target_apps_tag }}'
              ;;
            *)
              echo "Unknown matrix target: ${{ matrix.id }}" >&2
              exit 1
              ;;
          esac

          if [[ -z "$tag" ]]; then
            echo "Image tag must not be empty" >&2
            exit 1
          fi

          echo "value=$tag" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.owner.outputs.value }}/${{ matrix.image_name }}
          tags: |
            type=raw,value=${{ steps.image_tag.outputs.value }}
            type=raw,value=latest,enable=${{ inputs.publish_latest }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.title=${{ matrix.image_name }}
            org.opencontainers.image.version=${{ steps.image_tag.outputs.value }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
