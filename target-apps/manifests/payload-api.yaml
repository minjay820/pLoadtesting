target_app_id: payload-api
display_name: Payload API
runtime: python-fastapi
protocol: http-rest
base_url: http://127.0.0.1:18084
workload_types:
  - payload-size
  - upload
  - download
  - file-heavy
endpoints:
  - path: /health
    method: GET
  - path: /api/download
    method: GET
  - path: /api/upload
    method: POST
  - path: /api/files/manifest
    method: GET
  - path: /api/files/fixture-pack
    method: GET
  - path: /api/files/{file_id}
    method: GET
  - path: /api/files/archive
    method: GET
  - path: /api/files/read-many
    method: GET
  - path: /api/files/upload
    method: POST
safe_limits:
  max_download_kb: 512
  max_upload_bytes: 262144
  max_file_kb: 256
  max_file_manifest_count: 20
  max_archive_file_count: 10
  max_archive_kb_per_file: 64
default_profile: payload
notes: Deterministic payload, fixture-pack, archive, and read-many content avoids third-party dependencies and nondeterministic blobs.
