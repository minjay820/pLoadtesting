target_app_id: payload-api
display_name: Payload API
runtime: python-fastapi
protocol: http-rest
base_url: http://127.0.0.1:18084
workload_types:
  - payload-size
  - upload
  - download
endpoints:
  - path: /health
    method: GET
  - path: /api/download
    method: GET
  - path: /api/upload
    method: POST
safe_limits:
  max_download_kb: 512
  max_upload_bytes: 262144
default_profile: payload
notes: Deterministic filler content avoids third-party dependencies and nondeterministic blobs.

