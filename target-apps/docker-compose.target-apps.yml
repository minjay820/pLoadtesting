services:
  echo-api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      TARGET_APP_MODULE: echo_api
      PYTHONUNBUFFERED: "1"
    ports:
      - "127.0.0.1:${ECHO_API_PORT:-18080}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

