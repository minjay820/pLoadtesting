target_app_id: echo-api
profiles:
  - target_profile_id: echo-k6-smoke
    display_name: Echo Smoke via k6
    description: Lightweight smoke run against echo-api health endpoint.
    engine: k6
    equivalent_profile_id: echo-jmeter-smoke
    script_path: engines/k6/target_apps_echo_smoke.js
    target_url: http://echo-api:8000
    execution:
      duration_seconds: 10
      ramp_up_seconds: 0
      ramp_down_seconds: 0
      stop_policy: graceful_stop
      graceful_stop_seconds: 10
      max_run_seconds: 30
      iteration_limit:
      data_policy: duration_first
    parameters:
      TARGET_URL: http://echo-api:8000
      ECHO_MESSAGE: smoke
      ECHO_REPEAT: "1"
  - target_profile_id: echo-jmeter-smoke
    display_name: Echo Smoke via JMeter
    description: JMeter smoke run against echo-api GET echo endpoint.
    engine: jmeter
    equivalent_profile_id: echo-k6-smoke
    script_path: engines/jmeter/target_apps_echo_latency_plan.jmx
    target_url: http://echo-api:8000
    execution:
      duration_seconds: 20
      ramp_up_seconds: 5
      ramp_down_seconds: 0
      stop_policy: graceful_stop
      graceful_stop_seconds: 10
      max_run_seconds: 40
      iteration_limit:
      data_policy: duration_first
    parameters:
      target_url: http://echo-api:8000
      TARGET_HOST: echo-api
      TARGET_PORT: "8000"
      TARGET_PATH: /api/echo
      TARGET_METHOD: GET
      TARGET_QUERY: message=jmeter&repeat=1
