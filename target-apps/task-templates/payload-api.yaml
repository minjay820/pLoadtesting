target_app_id: payload-api
profiles:
  - target_profile_id: payload-jmeter-download
    display_name: Payload Download via JMeter
    description: JMeter download-oriented profile against payload-api.
    engine: jmeter
    equivalent_profile_id: payload-k6-download
    script_path: engines/jmeter/target_apps_payload_crud_plan.jmx
    target_url: http://127.0.0.1:18084
    execution:
      duration_seconds: 20
      ramp_up_seconds: 5
      ramp_down_seconds: 0
      stop_policy: graceful_stop
      graceful_stop_seconds: 10
      max_run_seconds: 40
      iteration_limit:
      data_policy: duration_first
    parameters:
      target_url: http://127.0.0.1:18084
      TARGET_HOST: 127.0.0.1
      TARGET_PORT: "18084"
      TARGET_PATH: /api/download
      TARGET_METHOD: GET
      TARGET_QUERY: kb=32
  - target_profile_id: payload-k6-download
    display_name: Payload Download via k6
    description: k6 bounded text payload download profile against payload-api.
    engine: k6
    equivalent_profile_id: payload-jmeter-download
    script_path: engines/k6/target_apps_payload_download.js
    target_url: http://127.0.0.1:18084
    execution:
      duration_seconds: 10
      ramp_up_seconds: 0
      ramp_down_seconds: 0
      stop_policy: graceful_stop
      graceful_stop_seconds: 10
      max_run_seconds: 30
      iteration_limit:
      data_policy: duration_first
    parameters:
      TARGET_URL: http://127.0.0.1:18084
      PAYLOAD_KB: "32"
  - target_profile_id: payload-jmeter-file-download
    display_name: Payload File Download via JMeter
    description: JMeter bounded fixture file download against payload-api.
    engine: jmeter
    equivalent_profile_id: payload-k6-file-download
    script_path: engines/jmeter/target_apps_payload_flow_plan.jmx
    target_url: http://127.0.0.1:18084
    parameters:
      target_url: http://127.0.0.1:18084
      TARGET_HOST: 127.0.0.1
      TARGET_PORT: "18084"
      FLOW_MODE: file-download
      FILE_ENDPOINT_PATH: /api/files/fixture-1
      FILE_KB: "32"
  - target_profile_id: payload-k6-file-download
    display_name: Payload File Download via k6
    description: Bounded file-like download against payload-api with deterministic fixture bytes.
    engine: k6
    equivalent_profile_id: payload-jmeter-file-download
    script_path: engines/k6/target_apps_payload_file_flow.js
    target_url: http://127.0.0.1:18084
    parameters:
