target_app_id: payload-api
profiles:
  - target_profile_id: payload-jmeter-download
    display_name: Payload Download via JMeter
    description: JMeter download-oriented profile against payload-api.
    engine: jmeter
    script_path: engines/jmeter/target_apps_payload_crud_plan.jmx
    target_url: http://127.0.0.1:18084
    parameters:
      target_url: http://127.0.0.1:18084
      TARGET_HOST: 127.0.0.1
      TARGET_PORT: "18084"
      TARGET_PATH: /api/download
      TARGET_METHOD: GET
      TARGET_QUERY: kb=32
  - target_profile_id: payload-k6-file-download
    display_name: Payload File Download via k6
    description: Bounded file-like download against payload-api with deterministic fixture bytes.
    engine: k6
    script_path: engines/k6/target_apps_payload_file_flow.js
    target_url: http://127.0.0.1:18084
    parameters:
      TARGET_URL: http://127.0.0.1:18084
      FILE_ENDPOINT_PATH: /api/files/fixture-1
      FILE_KB: "32"
      FILE_DISPOSITION: attachment
  - target_profile_id: payload-k6-file-roundtrip
    display_name: Payload File Roundtrip via k6
    description: Manifest, download, and bounded binary upload flow against payload-api.
    engine: k6
    script_path: engines/k6/target_apps_payload_file_flow.js
    target_url: http://127.0.0.1:18084
    parameters:
      TARGET_URL: http://127.0.0.1:18084
      FILE_ENDPOINT_PATH: /api/files/fixture-2
      FILE_KB: "24"
      FILE_DISPOSITION: attachment
      FILE_UPLOAD_MODE: "1"
  - target_profile_id: payload-k6-archive-read-many
    display_name: Payload Archive Read-Many via k6
    description: Fixture-pack metadata, zip archive, and read-many summary flow against payload-api.
    engine: k6
    script_path: engines/k6/target_apps_payload_archive_flow.js
    target_url: http://127.0.0.1:18084
    parameters:
      TARGET_URL: http://127.0.0.1:18084
      PACK_COUNT: "4"
      PACK_KB_PER_FILE: "12"
  - target_profile_id: payload-jmeter-archive-read-many
    display_name: Payload Read-Many via JMeter
    description: JMeter bounded archive-style read-many profile against payload-api.
    engine: jmeter
    script_path: engines/jmeter/target_apps_payload_crud_plan.jmx
    target_url: http://127.0.0.1:18084
    parameters:
      target_url: http://127.0.0.1:18084
      TARGET_HOST: 127.0.0.1
      TARGET_PORT: "18084"
      TARGET_PATH: /api/files/read-many
      TARGET_METHOD: GET
      TARGET_QUERY: count=4&kb_per_file=12
