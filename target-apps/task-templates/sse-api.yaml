target_app_id: sse-api
profiles:
  - target_profile_id: sse-k6-smoke
    display_name: SSE Smoke via k6
    description: Bounded SSE smoke stream against the events endpoint.
    engine: k6
    equivalent_profile_id: sse-jmeter-smoke
    script_path: engines/k6/target_apps_sse_smoke.js
    target_url: http://127.0.0.1:18087
