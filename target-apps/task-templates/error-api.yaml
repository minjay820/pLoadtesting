target_app_id: error-api
profiles:
  - target_profile_id: error-k6-flaky
    display_name: Deterministic Flaky via k6
    description: Deterministic flaky run that produces stable CI-visible failures.
    engine: k6
    script_path: engines/k6/target_apps_error_flaky.js
    target_url: http://127.0.0.1:18082
    parameters:
      TARGET_URL: http://127.0.0.1:18082
      FLAKY_RATE: "0.5"
      FLAKY_REQUEST_KEY: ci
  - target_profile_id: error-jmeter-flaky
    display_name: Deterministic Flaky via JMeter
    description: JMeter deterministic flaky profile pinned to the same failure branch used by CI-visible k6 checks.
    engine: jmeter
    script_path: engines/jmeter/target_apps_echo_latency_plan.jmx
    target_url: http://127.0.0.1:18082
    parameters:
      target_url: http://127.0.0.1:18082
      TARGET_HOST: 127.0.0.1
      TARGET_PORT: "18082"
      TARGET_PATH: /api/flaky
      TARGET_METHOD: GET
      TARGET_QUERY: rate=0.5&deterministic=true&request_key=ci
      EXPECTED_STATUS_PREFIX: "5"
